name: 功能建议
description: 描述需要解决的真实使用问题
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: 要解决的问题
      description: 描述场景、当前阻碍和受影响的人，不要只写方案。
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 建议方案
      description: 说明理想行为以及它为什么适合当前产品边界。
  - type: textarea
    id: alternatives
    attributes:
      label: 已考虑的替代方案
